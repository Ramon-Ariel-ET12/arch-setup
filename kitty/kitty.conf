# --- Tipografía (JetBrainsMono Nerd Font Mono; Noto Sans Mono fallback via fontconfig) ---
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Estética de la Ventana ---
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# --- Transparencia (Que Hyprland procesará con su Blur en Lua) ---
background_opacity 0.85

# --- Paleta de Colores (Catppuccin Mocha) ---
background            #1e1e2e
foreground            #cdd6f4
selection_background  #f5e0dc
selection_foreground  #1e1e2e
url_color             #f5e0dc
cursor                #f5e0dc

allow_remote_control yes

# Colores ANSI estándar
color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f38ba8
color2 #a6e3a1
color10 #a6e3a1
color3 #f9e2af
color11 #f9e2af
color4 #89b4fa
color12 #89b4fa
color5 #f5c2e7
color13 #f5c2e7
