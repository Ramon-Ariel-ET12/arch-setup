Ctrl+s screenshot

W cycle sub
E cycle audio

MBTN_RIGHT cycle pause

Alt+UP add speed 0.1
Alt+DOWN add speed -0.1

# --- Image mode (own UI: info icon only, no video OSC) ---
# Step through playlist entries, images and videos alike.
< playlist-prev
> playlist-next
ENTER playlist-next
i script-message image-info-toggle

# Zoom in/out on photos (Alt+Backspace resets zoom/pan, built-in default).
+ add video-zoom 0.1
- add video-zoom -0.1

# Rotate photo through 0/90/180/270 (replaces built-in subtitle shift on r).
r cycle-values video-rotate 0 90 180 270
