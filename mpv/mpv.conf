vo=gpu-next
hwdec=auto-safe
profile=high-quality

save-position-on-quit=yes
keep-open=yes

sub-auto=fuzzy
alang=es,spa,en
slang=es,spa,en

volume=100
volume-max=200
script-opts=ytdl_hook-ytdl_path=yt-dlp

# --- Image browsing (core options, see `man mpv`) ---
# Opening one image auto-queues the sibling images from its folder.
autocreate-playlist=same
# Stay on each image until you move (< / >), instead of auto-advancing.
image-display-duration=inf
# Cap huge photos to the screen instead of opening gigantic windows.
autofit-larger=90%x90%
# Don't carry zoom/pan/rotation from one image to the next.
reset-on-next-file=video-zoom,video-pan-x,video-pan-y,video-rotate

# --- Fonts (JetBrainsMono Nerd Font Mono; Noto Sans Mono fallback via fontconfig) ---
osd-font=JetBrainsMono Nerd Font Mono
sub-font=JetBrainsMono Nerd Font Mono
