general {
    lock_cmd = pidof hyprlock || (playerctl --all-players pause 2>/dev/null; hyprlock)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Lock session after 5 minutes of idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn screens off shortly after locking; back on when resuming
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
