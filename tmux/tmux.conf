# ~/.config/tmux/tmux.conf

# ------------------------------------------------------------
# PREFIX
# ------------------------------------------------------------
unbind C-b
set -g prefix C-a
set -g prefix2 None
bind C-a send-prefix

# ------------------------------------------------------------
# TERMINAL / PERFORMANCE
# ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",tmux*:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

set -sg escape-time 10
set -g focus-events on
set -g assume-paste-time 1
set -g allow-passthrough on

# ------------------------------------------------------------
# BEHAVIOR
# ------------------------------------------------------------
set -g history-limit 100000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g detach-on-destroy on

# ------------------------------------------------------------
# KEYS
# ------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: reloaded"

bind s command-prompt -p "session: " "new-session -A -s '%%'"
bind c new-window -c "#{session_path}"          # always session root
bind n next-window
bind p previous-window
bind w choose-tree -Zs
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind & command-prompt -I "#S" "rename-session -- '%%'"
# Rename pane (seeded with current title)
bind T command-prompt -I "#{pane_title}" "select-pane -T '%%'"


# Splits
#   | / -          → current pane path
#   \ / _  (Shift) → session root path
bind |  split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{session_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind _  split-window -v -c "#{session_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind Tab last-pane
bind x kill-pane
bind q display-panes -d 1200

# Move windows left/right while keeping focus
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ------------------------------------------------------------
# COPY MODE (vi)
# ------------------------------------------------------------
set -g mode-keys vi
set -g status-keys vi

bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Y send -X copy-pipe "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

# ------------------------------------------------------------
# STATUS LINE
# ------------------------------------------------------------
set -g status-position bottom
set -g status-style "fg=default,bg=default"
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bold] PREFIX #[default] ,}#[bold]#S#[default] "
set -g status-right "%a %d %b  %H:%M"
set -g status-justify centre
set -g status-interval 5

set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold,reverse] #I:#W #[default] "
set -g window-status-separator ""

# ------------------------------------------------------------
# PANE BORDERS
# ------------------------------------------------------------
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightwhite,bold"
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "
set -g pane-border-lines single          # was "rounded" (invalid for panes)

# Titles
set -g set-titles on
set -g set-titles-string " #S | #W"
set -g allow-rename on
