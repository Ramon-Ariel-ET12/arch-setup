# tmux.conf — arch-setup
#
# This repo dir is symlinked: ~/.config/tmux -> ~/Projects/arch-setup/tmux
# tmux loads $XDG_CONFIG_HOME/tmux/tmux.conf (or ~/.tmux.conf, unused here).
# Reload without restarting: `prefix + r`.

# ============================================================
# PREFIX
# ============================================================
# C-a instead of the C-b default. Inside tmux this shadows readline/zle's
# "beginning of line"; modes with their own prompt (fzf, copy mode) keep it.
unbind C-b
set -g prefix C-a

# prefix2 is the documented way to accept a second prefix key, so C-b keeps
# working for muscle memory from the tmux default.
set -g prefix2 C-b
bind C-a send-prefix
bind -T copy-mode C-a send-prefix

# ============================================================
# TERMINAL
# ============================================================
# tmux-256color carries RGB (Tc) and is what kitty expects. terminal-features
# declares capabilities terminfo does not report for these terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",tmux*:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# 10ms is the modern default and is enough for kitty. assume-paste-time keeps
# a fast paste from firing key bindings.
set -g escape-time 10
set -g repeat-time 600
set -g assume-paste-time 1
set -g focus-events on

# Clipboard over OSC 52 (kitty + Wayland). "external" = tmux writes to the
# system clipboard, apps inside tmux cannot clobber tmux's own buffers.
set -g set-clipboard external
set -g allow-passthrough on

# Window titles: apps may rename, tmux composes the visible terminal title.
set -g allow-rename on
set -g set-titles on
set -g set-titles-string " #S | #W"

# ============================================================
# BEHAVIOR
# ============================================================
set -g history-limit 100000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy on
set -g mouse on
set -g exit-empty off

# Dragonfly defaults: 80x24 virtual, tmux resizes to the real client.
set -g default-size 80x24
set -g window-size latest

# Persistent prompt history for :prompt across restarts.
set -g history-file ~/.config/tmux/history
set -g prompt-history-limit 500

# ============================================================
# KEYS — SESSIONS AND WINDOWS
# ============================================================
# new-session -A attaches if the session exists, creates it otherwise, so
# "tmux work" is enough from any shell. The name is prompted for (new-session
# alone cannot guess one), then the same command creates or attaches.
bind s command-prompt -p "session: " "new-session -A -s '%%'"
bind C command-prompt -p "session (cwd): " "new-session -A -s -c '#{pane_current_path}' '%%'"
bind d detach-client
bind X kill-server

bind c  new-window -c "#{pane_current_path}"
bind n  next-window
bind p  previous-window
# tmux has no key ranges in bind-key, so 1-9 are bound one by one.
bind -r 1 select-window -t :=1
bind -r 2 select-window -t :=2
bind -r 3 select-window -t :=3
bind -r 4 select-window -t :=4
bind -r 5 select-window -t :=5
bind -r 6 select-window -t :=6
bind -r 7 select-window -t :=7
bind -r 8 select-window -t :=8
bind -r 9 select-window -t :=9
bind 0 select-window -t :=10

bind w  choose-tree -Zs      # sessions/windows/panes tree
bind W  switch-client -l     # previous client
bind '{' swap-window -t -1
bind '}' swap-window -t +1

# rename-window/rename-session need a name argument, so they are wrapped in a
# command prompt seeded with the current name (same as tmux's own bindings).
# `r` is reserved for the reload binding further down.
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind & command-prompt -I "#S" "rename-session -- '%%'"

# ============================================================
# KEYS — PANES
# ============================================================
# Layouts vim-style: prefix, then two keys. Keys avoid anything used above
# (s = new session, w = choose-tree, so layouts use b/v/m/M/i/o/t).
bind Space next-layout
bind b send-prefix -t 2 \; select-layout even-horizontal
bind v send-prefix -t 2 \; select-layout even-vertical
bind m send-prefix -t 2 \; select-layout main-horizontal
bind M send-prefix -t 2 \; select-layout main-vertical
bind i send-prefix -t 2 \; select-layout main-horizontal-mirrored
bind o send-prefix -t 2 \; select-layout main-vertical-mirrored
bind t send-prefix -t 2 \; select-layout tiled

# Splits: | side by side, - stacked. Both inherit the current cwd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim movement (arrows already work by default).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with repeat: holding the key repeats the step.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-Up resize-pane -U 2
bind -r C-Down resize-pane -D 2
bind -r C-Left resize-pane -L 2
bind -r C-Right resize-pane -R 2

bind z resize-pane -Z       # toggle zoom on the active pane
bind Tab last-pane

# display-panes shows the big pane numbers, then returns to the active pane.
bind q display-panes -d 1200

# Kill panes: x closes, X confirms.
bind x kill-pane
bind Q kill-pane -t :.

# ============================================================
# KEYS — COPY MODE (vi)
# ============================================================
set -g mode-keys vi
set -g status-keys vi

bind [ copy-mode

# Selection and copy. wl-copy is the Wayland clipboard (hypr already uses it).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Y send -X copy-pipe "wl-copy"
bind -T copy-mode-vi C-e send -X copy-selection-and-cancel

# Leaving the mode.
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi c send -X clear-selection

# Navigation.
bind -T copy-mode-vi WheelUpPane   send -X -N 10 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 10 scroll-down
bind -T copy-mode-vi Up   send -X scroll-up
bind -T copy-mode-vi Down send -X scroll-down
bind -T copy-mode-vi C-Up send -X scroll-up 3
bind -T copy-mode-vi C-Down send -X scroll-down 3
bind -T copy-mode-vi PPage send -X page-up
bind -T copy-mode-vi NPage send -X page-down
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom
bind -T copy-mode-vi H send -X goto-top
bind -T copy-mode-vi M send -X goto-bottom
bind -T copy-mode-vi ^ send -X -N 1

# vim search: /pattern/Enter, ? backwards, n/N to repeat.
bind -T copy-mode-vi / send -X begin-search
bind -T copy-mode-vi ? send -X search-backward
bind -T copy-mode-vi n send -X search-next
bind -T copy-mode-vi N send -X search-previous

# Copy mode styling.
set -g copy-mode-position-style "fg=#6c7086"
set -g copy-mode-selection-style "fg=#1e1e2e,bg=#cba6f7"
set -g copy-mode-line-numbers relative

# ============================================================
# KEYS — BUFFERS, POPUPS AND MESSAGES
# ============================================================
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: config reloaded"

bind ] paste-buffer -d
bind P display-popup -E -w 60% -h 40% "tmux list-buffers"

# Message and mode colors, plus the prompt cursor (there is no command-style
# option: the prompt bar itself uses the status line colors).
set -g message-style "fg=#1e1e2e,bg=#cba6f7"
set -g mode-style "fg=#1e1e2e,bg=#a6e3a1"
set -g prompt-cursor-colour "#cba6f7"
set -g prompt-cursor-style block

# ============================================================
# APPEARANCE — CATPPUCCIN MOCHA (same palette as kitty/kitty.conf)
# ============================================================
# pane-colours[] is the palette tmux serves to apps, so fzf/neovim/bat output
# matches the theme of the rest of the desktop.
set -g pane-colours[0]  "#45475a"   # surface1
set -g pane-colours[1]  "#f38ba8"   # red
set -g pane-colours[2]  "#a6e3a1"   # green
set -g pane-colours[3]  "#f9e2af"   # yellow
set -g pane-colours[4]  "#89b4fa"   # blue
set -g pane-colours[5]  "#cba6f7"   # mauve
set -g pane-colours[6]  "#94e2d5"   # teal
set -g pane-colours[7]  "#bac2de"   # subtext1
set -g pane-colours[8]  "#585b70"   # surface2
set -g pane-colours[9]  "#f38ba8"
set -g pane-colours[10] "#a6e3a1"
set -g pane-colours[11] "#f9e2af"
set -g pane-colours[12] "#89b4fa"
set -g pane-colours[13] "#cba6f7"
set -g pane-colours[14] "#94e2d5"
set -g pane-colours[15] "#a6adc8"   # subtext0

# Pane background is kitty's base, so the terminal padding and the tmux area
# do not read as two separate rectangles.
set -g window-style "fg=#cdd6f4,bg=#1e1e2e"

# Pane borders: surface0 when inactive, blue when active.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-format " #{pane_index} "

# Rounded pane borders only exist from tmux 3.8 on (the 3.7 pane-border-lines
# list is single/double/heavy/simple/number/spaces). Detect the version and fall
# back to square lines, so this file works on both.
%if "#{m:3.8,#{version},}"
set -g pane-border-lines rounded
%else
set -g pane-border-lines single
%endif

# Scrollbars only show in copy mode, so they never steal width or reflow text.
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "fg=#313244,bg=#181825"

# Block cursor, same as kitty.
set -g cursor-style block
set -g cursor-colour "#f5e0dc"

# ============================================================
# STATUS LINE
# ============================================================
# One centered line. Left: prefix indicator + session. Right: date + time.
# The "PREFIX" block only shows while the prefix key is held, so there is no
# need to look at the prompt to know a tmux command is being typed.
set -g status-position bottom
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-style "fg=#6c7086,bg=#181825"

set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#1e1e2e,bg=#f9e2af,bold] PREFIX #[default] ,}#[fg=#181825,bg=#89b4fa,bold] #S #[default]"

set -g status-right-length 40
set -g status-right "#[fg=#cdd6f4,bg=#45475a] %a %d %b  %H:%M #[default]"

# Window list: index + name, current window inverted on blue.
set -g window-status-format " #[fg=#6c7086]#I:#W#[default]"
set -g window-status-current-format " #[fg=#181825,bg=#89b4fa,bold]#I:#W#[default]"
set -g window-status-activity-style "fg=#f9e2af,bold"
set -g window-status-bell-style "fg=#f38ba8,bold"
set -g window-status-last-style "fg=#a6adc8"
set -g window-status-separator " "

# Popups styled to match the rest.
set -g popup-style "fg=#cdd6f4,bg=#181825"
set -g popup-border-style "fg=#89b4fa"
set -g popup-border-lines rounded